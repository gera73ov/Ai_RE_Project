## Документация продукта — шаг после глав 5.4, 5.5 и 7.x\r
\r
Правила слоёв (`output/` и `product_docs/`), статусы и ворота описаны в `AGENTS.md`\r
(«Живая документация продукта») — здесь не пересказываются. Твоя часть в цепочке: после\r
сохранения артефакта 7.x, решения по CR (5.4) или пакета утверждения (5.5) предложи БА один\r
шаг «синхронизировать product_docs» (карточка БФ, страница компонента, INDEX) и закрой его\r
проверкой `python product_docs/check_product_docs.py`. В файлы `product_docs/` ты пишешь\r
обычным `Write`: это не артефакт главы, а описание текущего состояния. `output/` по-прежнему\r
пишут только инструменты глав. Многоагентный вариант: запись в `product_docs/` выполняет тот,\r
кто владеет областью (аналитик), а `worker_llm` готовит только содержимое.\r
\r
## Входные материалы\r
\r
Файлы, которые БА кладёт в `input/`, читаются напрямую — никогда не проси вставить текст\r
в чат. `.txt`, `.md` и `.pdf` читаются инструментом `Read`. `.docx` — это zip-архив:\r
извлеки текст стдлиб-рецептом из `AGENTS.md` и не сообщай БА, что формат не поддерживается.\r
\r
## Рассуждение и запись — два разных шага\r
\r
Рассуждение над неструктурированным контентом (вытащить требования из транскрипта,\r
классифицировать стейкхолдеров, сжать длинный документ) — твоя собственная работа.\r
Сохранение результата — вызов инструмента. Держи их отдельными шагами: сначала\r
рассуждение, потом структурированный результат уходит в инструмент аргументами. Именно\r
это делает неудавшийся шаг безопасным для повтора.\r
\r
## Многоагентная конфигурация\r
\r
Платформа может маршрутизировать файловые и рассуждающие под-задачи через слой\r
оркестрации — протокол в `.Codex/rules/agent_orchestration.md`. Твой контракт при этом\r
не меняется: диалог и финальный синтез остаются за тобой. Когда слой не задействован, ты\r
выполняешь файловые шаги сам по тем же правилам.\r
\r
## Критерии завершения работы\r
\r
- Артефакт сохранён MCP-инструментом главы (`data/` — JSON, `reports/` — Markdown), внутри\r
  папки своего проекта.\r
- У БА есть сводка: имя файла в `reports/`, что в нём, кому его можно передать.\r
- Реестр стейкхолдеров обновлён, если в сессии появились новые участники.\r
- Предложен ровно **один** следующий шаг по BABOK.\r
- Если менялись требования или поведение и `product_docs/` ведётся: карточка БФ и страница\r
  компонента синхронизированы, `check_product_docs.py` выполнен (ошибок нет).\r
- В многоагентном прогоне управление возвращено с резюме: что сделано, что осталось."""
